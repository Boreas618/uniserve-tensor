[package]
name = "uniserve-tensor"
version = "0.1.0"
edition = "2021"
description = "Tensors, views and backends for UniServe, derived from candle-core"
repository = "https://github.com/Boreas618/uniserve-tensor"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lib]
name = "uniserve_tensor"

[dependencies]
accelerate-src = { version = "0.3.2", optional = true }
byteorder = "1.4.3"
candle-kernels = { version = "0.11.1", optional = true }
candle-metal-kernels = { version = "0.11.1", optional = true }
objc2-metal = { version = "0.3.1", optional = true }
objc2-foundation = { version = "0.3.1", optional = true }
cudarc = { version = "0.19.10", optional = true, default-features = false, features = ["std", "cublas", "cublaslt", "curand", "driver", "nvrtc", "f16", "f8", "cuda-version-from-build-system", "dynamic-linking"] }
cutile = { version = "=0.3.1", optional = true }
gemm = { version = "0.19.0", features = ["wasm-simd128-enable"] }
half = { version = "2.5.0", features = ["num-traits", "use-intrinsics", "rand_distr", "zerocopy"] }
float8 = { version = "0.7.0", features = ["num-traits", "rand_distr"] }
intel-mkl-src = { version = "0.8.1", optional = true, features = ["mkl-static-lp64-iomp"] }
libc = "0.2.147"
libm = "0.2.15"
memmap2 = { version = "0.9.3", features = ["stable_deref_trait"] }
num-traits = "0.2.15"
num_cpus = "1.15.0"
rand = "0.9.0"
rand_distr = "0.5.1"
rayon = "1.7.0"
safetensors = "0.8.0"
thiserror = "2"
yoke = { version = "0.8.1", features = ["derive"] }
zerocopy = "0.8"
zip = { version = "9.1.3", default-features = false }
parking_lot = "0.12.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
anyhow = { version = "1", features = ["backtrace"] }
clap = { version = "4.2.4", features = ["derive"] }
criterion = { version = "0.8", default-features = false }

[features]
default = []
cuda = ["cudarc", "dep:candle-kernels"]
cutile = ["cuda", "dep:cutile"]
cudnn = ["cuda", "cudarc/cudnn"]
nccl = ["cuda", "cudarc/nccl"]
mkl = ["dep:intel-mkl-src"]
accelerate = ["dep:accelerate-src"]
metal = ["dep:objc2-metal", "dep:objc2-foundation", "dep:candle-metal-kernels"]
metal-debug-labels = ["metal", "candle-metal-kernels/debug-labels"]

[[bench]]
name = "bench_main"
harness = false

[[example]]
name = "metal_basics"
required-features = ["metal"]

[[example]]
name = "cuda_basics"
required-features = ["cuda"]

[[example]]
name = "cutile"
required-features = ["cutile"]
